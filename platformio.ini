[env:nodemcuv2]
platform = espressif8266 @ 4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps = 
	paulstoffregen/Time@^1.6.1
	mathertel/LiquidCrystal_PCF8574@^2.2.0
	tobiasschuerg/ESP8266 Influxdb@^3.13.2
	tzapu/WiFiManager@^2.0.17
